<section class="portfolio">
    <h2>Our Portfolio</h2>

    <div class="gallery">
        <img src="images/nail1.jpeg" alt="Nail design 1" onclick="openModal(this)">
        <img src="images/nail2.jpeg" alt="Nail design 2" onclick="openModal(this)">
        <img src="images/nail3.jpeg" alt="Nail design 3" onclick="openModal(this)">
        <img src="images/nail4.jpeg" alt="Nail design 2" onclick="openModal(this)">
        <img src="images/nail5.jpeg" alt="Nail design 3" onclick="openModal(this)">
    </div>
</section>

<!-- Image Modal -->
<div id="imgModal" class="modal" onclick="closeModal()">
    <span class="close">&times;</span>
    <img class="modal-content" id="modalImg">
</div>

<script>
function openModal(imgElement) {
    document.getElementById("imgModal").style.display = "block";
    document.getElementById("modalImg").src = imgElement.src;
}

function closeModal() {
    document.getElementById("imgModal").style.display = "none";
}
</script>
