<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Portfolio — Charley's Nails</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="logo">← Home</a>
  <h1>Portfolio</h1>
</header>

<!-- CATEGORY BUTTONS -->
<section class="portfolio-categories">
  <button class="category-btn active" onclick="filterCategory('all')">All</button>
  <button class="category-btn" onclick="filterCategory('acrylic')">Acrylic Nails</button>
  <button class="category-btn" onclick="filterCategory('gel')">Gel Nails</button>
  <button class="category-btn" onclick="filterCategory('lashes')">Eye Lashes</button>
  <button class="category-btn" onclick="filterCategory('mani')">Manicure & Pedicure</button>
</section>

<!-- GALLERY -->
<main class="gallery-grid" id="gallery">
  <!-- All images will be dynamically inserted by JS -->
</main>

<!-- LIGHTBOX -->
<div id="lightbox">
  <span class="close" onclick="closeLightbox()">×</span>
  <img id="lightbox-img">
  <p id="lightbox-caption"></p>
  <button class="nav-btn prev" onclick="changeImage(-1)">❮</button>
  <button class="nav-btn next" onclick="changeImage(1)">❯</button>
</div>

<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>

<script src="portfolio.js"></script>
</body>
</html>
