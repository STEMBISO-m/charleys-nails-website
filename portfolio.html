<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Charley's Nails & Eye Lashes</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Charley's Nails & Eye Lashes</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="portfolio.html" class="active">Portfolio</a>
            <a href="booking.html">Book Appointment</a>
        </nav>
    </header>

    <section class="portfolio">
        <h2>Our Luxury Portfolio</h2>

        <div class="gallery">
            <img src="images/nail1.jpeg" alt="Nail design 1" onclick="openModal(this)">
            <img src="images/nail2.jpeg" alt="Nail design 2" onclick="openModal(this)">
            <img src="images/nail3.jpeg" alt="Nail design 3" onclick="openModal(this)">
            <img src="images/nail4.jpeg" alt="Nail design 2" onclick="openModal(this)">
            <img src="images/nail5.jpeg" alt="Nail design 3" onclick="openModal(this)">
        </div>
    </section>

    <!-- Luxury Image Modal -->
    <div id="luxModal" class="lux-modal">
        <div class="lux-modal-content">
            <span class="lux-close" onclick="closeLuxury()">&times;</span>
            <img id="luxImg" class="lux-img">
        </div>
    </div>

    <script>
    function openModal(img) {
        document.getElementById("luxModal").style.display = "flex";
        document.getElementById("luxImg").src = img.src;
    }

    function closeLuxury() {
        document.getElementById("luxModal").style.display = "none";
    }
    </script>

</body>
</html>
