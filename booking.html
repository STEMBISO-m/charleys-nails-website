<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book Appointment — Charley's Nails</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="logo">← Home</a>
    <h1>Book Your Appointment</h1>
  </header>

  <main class="booking-wrap">

    <section class="contact-details card">
      <h2>Contact & Location</h2>
      <p><strong>Address:</strong> 36 Madeira Street, Mthatha 5100</p>
      <p><strong>WhatsApp:</strong> <a href="https://wa.me/27710668814" target="_blank">071 066 8814</a></p>
      <p><strong>Email:</strong> <a href="mailto:cajiboye49@gmail.com">cajiboye49@gmail.com</a></p>
      <p><em>Open 24/7</em></p>
    </section>

    <section class="card form-card">
      <h2>Quick Booking</h2>

      <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="booking-form">
        <label>Name</label>
        <input name="name" required>

        <label>Phone / WhatsApp</label>
        <input name="phone" required>

        <label>Service</label>
        <select name="service" required>
          <option value="">Choose a service</option>
          <option>Acrylic Nails</option>
          <option>Gel Polish</option>
          <option>Nail Art</option>
          <option>Eye Lashes</option>
        </select>

        <label>Preferred Date</label>
        <input type="date" name="date" required>

        <label>Preferred Time</label>
        <input type="time" name="time" required>

        <label>Notes (Optional)</label>
        <textarea name="notes" rows="3"></textarea>

        <button type="submit" class="btn">Send Booking</button>
      </form>

      <p class="hint">Or WhatsApp us at <a href="https://wa.me/27710668814" target="_blank">071 066 8814</a> — fastest reply!</p>
    </section>

  </main>

  <footer class="footer">
    <p>© <span id="year2"></span> Charley's Nails & Eye Lashes</p>
  </footer>

  <script>
    document.getElementById('year2').textContent = new Date().getFullYear();
  </script>

</body>
</html>
