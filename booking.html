<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Book Appointment — Charley’s Nails</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"/>

</head>
<body>

<header class="topbar">
  <a href="index.html" class="logo">← Home</a>
  <h1>Book Your Appointment</h1>
</header>

<section class="booking-container">

  <div class="booking-form-box">

    <h2>
      <img src="https://img.icons8.com/fluency/48/planner.png"/>
      Book with Charley
    </h2>

    <form class="booking-form" id="bookingForm">

      <label>
        <img src="https://img.icons8.com/fluency/24/user.png"/>
        Full Name
      </label>
      <input type="text" id="name" placeholder="Enter your full name" required>

      <label>
        <img src="https://img.icons8.com/fluency/24/phone.png"/>
        Phone Number
      </label>
      <input type="tel" id="phone" placeholder="e.g 071 000 0000" required>

      <label>
        <img src="https://img.icons8.com/fluency/24/services.png"/>
        Select Service
      </label>
      <select id="service" required>
        <option value="">Select a service</option>
        <option>Acrylic Nails</option>
        <option>Gel Nails</option>
        <option>Eye Lashes</option>
        <option>Manicure & Pedicure</option>
        <option>Combo Package</option>
      </select>

      <label>
        <img src="https://img.icons8.com/fluency/24/calendar.png"/>
        Appointment Date
      </label>
      <input type="date" id="date" required>

      <label>
        <img src="https://img.icons8.com/fluency/24/clock.png"/>
        Appointment Time
      </label>
      <input type="time" id="time" required>

      <label>
        <img src="https://img.icons8.com/fluency/24/comments.png"/>
        Additional Notes
      </label>
      <textarea id="notes" rows="4" placeholder="Any special request..."></textarea>

      <button type="button" class="btn" onclick="sendBooking()">
        Confirm Booking
      </button>

      <p id="successMsg" style="display:none; margin-top:15px; color:gold; text-align:center;">
        ✅ If you come after the time you booked, you join the line.
      </p>

    </form>
  </div>


  <!-- CONTACT AREA -->
  <div class="booking-info-box">

    <h2>
      <img src="https://img.icons8.com/fluency/48/contacts.png"/>
      Contact & Location
    </h2>

    <p>
      <img src="https://img.icons8.com/fluency/24/marker.png"/>
      36 Madeira Street, Mthatha 5100
    </p>

    <p>
      <img src="https://img.icons8.com/fluency/24/whatsapp.png"/>
      071 066 8814
    </p>

    <p>
      <img src="https://img.icons8.com/fluency/24/new-post.png"/>
      cajiboye49@gmail.com
    </p>

    <p>
      <img src="https://img.icons8.com/fluency/24/clock.png"/>
      Open 24/7
    </p>

    <div class="booking-socials">

      <a class="icon-btn" href="https://wa.me/27710668814" target="_blank">
        <img src="https://img.icons8.com/fluency/48/whatsapp.png"/>
        <span>Chat on WhatsApp</span>
      </a>

      <a class="icon-btn" href="mailto:cajiboye49@gmail.com">
        <img src="https://img.icons8.com/fluency/48/new-post.png"/>
        <span>Email Me</span>
      </a>

    </div>

  </div>

</section>

<!-- ✅ SCRIPT ADDED (WhatsApp + Message) -->
<script>
function sendBooking() {

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const service = document.getElementById("service").value;
  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;
  const notes = document.getElementById("notes").value || "None";

  if (!name || !phone || !service || !date || !time) {
    alert("Please fill in all required fields.");
    return;
  }

  const message =
    `Hello Charley's Nails 💅✨%0A%0A` +
    `New Booking Request:%0A` +
    `------------------------%0A` +
    `Name: ${name}%0A` +
    `Phone: ${phone}%0A` +
    `Service: ${service}%0A` +
    `Date: ${date}%0A` +
    `Time: ${time}%0A` +
    `Notes: ${notes}`;

  window.open(`https://wa.me/27710668814?text=${message}`, "_blank");

  document.getElementById("successMsg").style.display = "block";

  document.getElementById("bookingForm").reset();
}
</script>

</body>
</html>
