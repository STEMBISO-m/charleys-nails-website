<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Book Appointment — Charley’s Nails</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"/>

</head>
<body>

<header class="topbar">
  <a href="index.html" class="logo">← Home</a>
  <h1>Book Your Appointment</h1>
</header>


<section class="booking-container">

  <!-- FORM AREA -->
  <div class="booking-form-box">

    <h2>
      <img src="https://img.icons8.com/fluency/48/planner.png"/>
      Book with Charley
    </h2>

    <form class="booking-form">

      <label>
        <img src="https://img.icons8.com/fluency/24/user.png"/>
        Full Name
      </label>
      <input type="text" placeholder="Enter your full name" required>

      <label>
        <img src="https://img.icons8.com/fluency/24/phone.png"/>
        Phone Number
      </label>
      <input type="tel" placeholder="e.g 071 000 0000" required>

      <label>
        <img src="https://img.icons8.com/fluency/24/services.png"/>
        Select Service
      </label>
      <select required>
        <option>Select a service</option>
        <option>Acrylic Nails</option>
        <option>Gel Nails</option>
        <option>Eye Lashes</option>
        <option>Manicure & Pedicure</option>
        <option>Combo Package</option>
      </select>

      <label>
        <img src="https://img.icons8.com/fluency/24/calendar.png"/>
        Appointment Date
      </label>
      <input type="date" required>

      <label>
        <img src="https://img.icons8.com/fluency/24/clock.png"/>
        Appointment Time
      </label>
      <input type="time" required>

      <label>
        <img src="https://img.icons8.com/fluency/24/comments.png"/>
        Additional Notes
      </label>
      <textarea rows="4" placeholder="Any special request..."></textarea>

      <button type="submit" class="btn">Confirm Booking</button>

    </form>
  </div>


  <!-- CONTACT AREA -->
  <div class="booking-info-box">

    <h2>
      <img src="https://img.icons8.com/fluency/48/contacts.png"/>
      Contact & Location
    </h2>

    <p>
      <img src="https://img.icons8.com/fluency/24/marker.png"/>
      36 Madeira Street, Mthatha 5100
    </p>

    <p>
      <img src="https://img.icons8.com/fluency/24/whatsapp.png"/>
      071 066 8814
    </p>

    <p>
      <img src="https://img.icons8.com/fluency/24/new-post.png"/>
      cajiboye49@gmail.com
    </p>

    <p>
      <img src="https://img.icons8.com/fluency/24/clock.png"/>
      Open 24/7
    </p>

    <div class="booking-socials">

      <a class="icon-btn" href="https://wa.me/27710668814" target="_blank">
        <img src="https://img.icons8.com/fluency/48/whatsapp.png"/>
        <span>Chat on WhatsApp</span>
      </a>

      <a class="icon-btn" href="mailto:cajiboye49@gmail.com">
        <img src="https://img.icons8.com/fluency/48/new-post.png"/>
        <span>Email Me</span>
      </a>

    </div>

  </div>

</section>

</body>
</html>
